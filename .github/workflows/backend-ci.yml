# Backend validation pipeline.
#
# This workflow is intentionally read-only with respect to repository state. It
# runs checks but never creates branches, pushes, opens pull requests or merges.
# Jose remains the only Git/GitHub integration authority.

name: Backend CI Validation

# Ejecuta cuando:
# - Push a main o develop en archivos del backend
# - Pull request a main o develop
# - Manualmente desde la UI de GitHub (workflow_dispatch)
on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements.test.lock.txt'
      - 'pyproject.toml'
      - 'compose.test.yml'
      - '.github/workflows/backend-ci.yml'
  # Sin filtro de paths: un check obligatorio que no llega a ejecutarse deja el
  # PR bloqueado para siempre esperando un resultado que nunca aparece.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancelar ejecuciones previas en la misma rama
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: tests y linting
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Igual que runtime.txt, que es lo que corre en produccion.
          python-version: '3.11'
          # Cache de pip para builds mas rapidos
          cache: 'pip'
          cache-dependency-path: requirements.test.lock.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.test.lock.txt
          # Test and quality tools are pinned in the test lock. Do not
          # reinstall unpinned versions after this step.

      # Las misiones usan transacciones, asi que Mongo tiene que ser replica
      # set y no una instancia suelta. `services:` no deja pasar `--replSet` al
      # proceso, y el compose de test ya monta exactamente esa topologia.
      - name: Levantar MongoDB de test
        run: |
          docker compose -f compose.test.yml up -d --wait
          python scripts/ensure_test_mongo.py

      - name: Linting (Ruff)
        run: ruff check app/ tests/ scripts/ --output-format=github

      - name: Type checking (MyPy)
        # Informativo mientras quedan errores de tipos por resolver. El paso se
        # marca como fallido-ignorado a proposito: en verde no se leeria nunca.
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Seguridad del codigo (Bandit)
        # Bloquea de verdad a partir de severidad media. Los hallazgos low son
        # ruido conocido (asserts en tests, binds de desarrollo).
        run: bandit -r app/ -q -ll

      - name: Ejecutar todos los tests con cobertura
        env:
          # Variables de entorno para tests
          # 127.0.0.1 y no localhost: el compose publica solo en IPv4.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: ufc_picks_test
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-min-32-chars
          JWT_ALGORITHM: HS256
          GOOGLE_CLIENT_ID: fake-google-client-id-for-testing
          APP_ENV: test
          DEBUG: false
          # Variables para sistema de imagenes (modo MEMORY para tests)
          IMAGE_CACHE_STRATEGY: MEMORY
          IMAGE_SOURCE_MODE: s3
          # Variables de S3 (valores fake para tests que no usan S3 real)
          AWS_ACCESS_KEY_ID: fake-access-key-for-testing
          AWS_SECRET_ACCESS_KEY: fake-secret-key-for-testing
          AWS_S3_BUCKET: fake-bucket-for-testing
          AWS_REGION: us-east-1
          AWS_CLOUDFRONT_DOMAIN: fake.cloudfront.net
        # -n auto reparte los tests entre todos los cores del runner.
        run: python -m pytest tests/ --cov=app --cov-report=term-missing -n auto

